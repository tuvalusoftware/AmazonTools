<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Book Club — Request Received</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 to-blue-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8 text-center">

    <div class="flex items-center justify-center gap-2 mb-6">
      <img src="/static/img/bookshelf.png" alt="" class="w-8 h-8 rounded object-cover" />
      <span class="text-sm font-bold text-slate-700 tracking-tight">The Book Club</span>
    </div>

    <div class="flex items-center justify-center w-14 h-14 rounded-full bg-emerald-100 mx-auto mb-5">
      <svg class="w-7 h-7 text-emerald-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>

    <h1 class="text-xl font-bold text-slate-800 mb-2">
      We've received your request
    </h1>
    <p class="text-sm text-slate-500 mb-8">
      We're looking up your book on Amazon in the background — you don't need
      to keep this page open. You'll get a confirmation email once it's done,
      usually within a minute.
    </p>

    <a
      href="/"
      class="inline-block rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 text-sm transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
    >
      Register another book
    </a>

  </div>
</body>
</html>
