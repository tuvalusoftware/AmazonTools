<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register Your Book — Author BSR Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-100 to-blue-50 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

    <div class="mb-6 text-center">
      <h1 class="text-2xl font-bold text-slate-800">Register Your Book</h1>
      <p class="text-sm text-slate-500 mt-1">Track daily Amazon Best Seller Rank and receive email digests.</p>
    </div>

    {% if error %}
    <div class="mb-5 rounded-lg bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700" role="alert">
      <strong class="font-semibold">Error:</strong> {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/register" class="space-y-5" novalidate>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="email">
          Email address
        </label>
        <input
          id="email"
          type="email"
          name="email"
          value="{{ email or '' }}"
          required
          placeholder="you@example.com"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="title">
          Book title
        </label>
        <input
          id="title"
          type="text"
          name="title"
          value="{{ title or '' }}"
          required
          placeholder="e.g. Atomic Habits"
          class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1" for="profit_pct">
          Profit % per sale
        </label>
        <div class="relative">
          <input
            id="profit_pct"
            type="number"
            name="profit_pct"
            value="{{ profit_pct or '' }}"
            min="0"
            max="100"
            step="0.1"
            required
            placeholder="70"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 pr-8 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
          />
          <span class="absolute inset-y-0 right-3 flex items-center text-slate-400 text-sm pointer-events-none">%</span>
        </div>
        <p class="mt-1.5 text-xs text-slate-400">Book price is fetched automatically from Amazon each day.</p>
      </div>

      <button
        type="submit"
        class="w-full rounded-lg bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold py-2.5 text-sm transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
      >
        Register Book
      </button>

    </form>
  </div>
</body>
</html>
